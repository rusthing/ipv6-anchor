# ipv6-anchor 配置示例
#
#   cp config.example.toml ipv6-anchor.toml
#   export DYNV6_TOKEN=你的token
#   ipv6-anchor --dry-run        # 先看要请求的 URL
#   ipv6-anchor                  # 常驻；或 --once 跑一次

# 只有这两项是必需的
hostname = "myhost.dynv6.net"

# token 建议走环境变量 DYNV6_TOKEN，别写进文件
# token = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# 检查间隔（秒），默认 300，最小 60
# interval = 300

# 路由器会跟着运营商换前缀时，把这个打开，连 zone 前缀一起更新
# update_prefix = false
