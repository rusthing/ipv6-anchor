[package]
name = "ipv6-anchor"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
authors = ["zbz <nnzbz@qq.com>"]
description = "把本机公网 IPv6 地址锚定到 dynv6 的 AAAA 记录，整个程序就是一个 GET"
license = "MIT"
repository = "https://github.com/rusthing/ipv6-anchor"
readme = "README.md"
keywords = ["ddns", "ipv6", "dynv6", "dns", "dynamic-dns"]
categories = ["command-line-utilities", "network-programming"]

# 只打包真正要发出去的文件
include = ["src/**", "Cargo.toml", "README.md", "LICENSE", "config.example.toml"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
# 只要 TLS + gzip。请求必须直连（dynv6 的 ipv6=auto 会把「连接源地址」写进 AAAA，
# 走代理就记成代理出口地址了）。注意 ureq 3.5 已经没有 proxy-from-env 特性开关，
# Config::default() 无条件调 Proxy::try_from_env()，只能在 dynv6.rs 里显式 .proxy(None)。
ureq = "3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
